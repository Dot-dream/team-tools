[project]
name = "moba-agent-bridge"
version = "0.1.0"
description = "MobaXterm bridge MCP server - connects AI agents to serial/SSH sessions via MobaXterm"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "pyserial>=3.5",
]

[project.scripts]
moba-agent-bridge = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
